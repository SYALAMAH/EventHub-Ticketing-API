<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 24px; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .card-hdr { fill: #334155; rx: 8; }
      .hdr-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 14px; fill: #f1f5f9; }
      .hdr-tag { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #38bdf8; font-weight: 600; }
      .row-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #e2e8f0; }
      .type-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #64748b; }
      .pk-badge { fill: #eab308; font-weight: bold; font-family: sans-serif; font-size: 10px; }
      .fk-badge { fill: #06b6d4; font-weight: bold; font-family: sans-serif; font-size: 10px; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 4; }
      .line-solid { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .marker { fill: #38bdf8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Header -->
  <text x="50" y="45" class="title">Event Ticketing &amp; Venue Booking System - Entity Relationship Diagram (ERD)</text>
  <text x="50" y="70" class="subtitle">Relational Database Specification for SWC3633/SWC4443 Web API Development (MySQL / MariaDB)</text>

  <!-- TABLE: USERS (Top Left) -->
  <g transform="translate(50, 100)">
    <rect width="320" height="235" class="card-bg" />
    <path d="M 0 0 h 320 v 35 h -320 Z" fill="#1e3a8a" rx="8" />
    <text x="15" y="23" class="hdr-text">users</text>
    <text x="250" y="23" class="hdr-tag">Core Entity</text>

    <text x="15" y="55" class="pk-badge">PK</text>
    <text x="40" y="55" class="row-text">user_id</text>
    <text x="210" y="55" class="type-text">INT AUTO_INC</text>

    <text x="40" y="80" class="row-text">full_name</text>
    <text x="210" y="80" class="type-text">VARCHAR(100)</text>

    <text x="40" y="105" class="row-text">email (UNIQUE)</text>
    <text x="210" y="105" class="type-text">VARCHAR(150)</text>

    <text x="40" y="130" class="row-text">password_hash</text>
    <text x="210" y="130" class="type-text">VARCHAR(255)</text>

    <text x="40" y="155" class="row-text">phone</text>
    <text x="210" y="155" class="type-text">VARCHAR(20)</text>

    <text x="40" y="180" class="row-text">role</text>
    <text x="210" y="180" class="type-text">ENUM(admin..)</text>

    <text x="40" y="205" class="row-text">api_key (UNIQUE)</text>
    <text x="210" y="205" class="type-text">VARCHAR(100)</text>

    <text x="40" y="225" class="row-text">created_at</text>
    <text x="210" y="225" class="type-text">TIMESTAMP</text>
  </g>

  <!-- TABLE: VENUES (Top Center) -->
  <g transform="translate(440, 100)">
    <rect width="320" height="210" class="card-bg" />
    <path d="M 0 0 h 320 v 35 h -320 Z" fill="#047857" rx="8" />
    <text x="15" y="23" class="hdr-text">venues</text>
    <text x="250" y="23" class="hdr-tag">Core Entity</text>

    <text x="15" y="55" class="pk-badge">PK</text>
    <text x="40" y="55" class="row-text">venue_id</text>
    <text x="210" y="55" class="type-text">INT AUTO_INC</text>

    <text x="40" y="85" class="row-text">venue_name</text>
    <text x="210" y="85" class="type-text">VARCHAR(150)</text>

    <text x="40" y="115" class="row-text">location</text>
    <text x="210" y="115" class="type-text">VARCHAR(255)</text>

    <text x="40" y="145" class="row-text">capacity</text>
    <text x="210" y="145" class="type-text">INT</text>

    <text x="40" y="175" class="row-text">description</text>
    <text x="210" y="175" class="type-text">TEXT</text>

    <text x="40" y="200" class="row-text">approval_status</text>
    <text x="210" y="200" class="type-text">ENUM(status..)</text>
  </g>

  <!-- TABLE: CATEGORIES (Top Right) -->
  <g transform="translate(830, 100)">
    <rect width="320" height="150" class="card-bg" />
    <path d="M 0 0 h 320 v 35 h -320 Z" fill="#6d28d9" rx="8" />
    <text x="15" y="23" class="hdr-text">categories</text>
    <text x="245" y="23" class="hdr-tag">Lookup Table</text>

    <text x="15" y="55" class="pk-badge">PK</text>
    <text x="40" y="55" class="row-text">category_id</text>
    <text x="210" y="55" class="type-text">INT AUTO_INC</text>

    <text x="40" y="90" class="row-text">category_name (UQ)</text>
    <text x="210" y="90" class="type-text">VARCHAR(100)</text>

    <text x="40" y="125" class="row-text">description</text>
    <text x="210" y="125" class="type-text">TEXT</text>
  </g>

  <!-- TABLE: EVENTS (Center) -->
  <g transform="translate(440, 390)">
    <rect width="320" height="355" class="card-bg" />
    <path d="M 0 0 h 320 v 35 h -320 Z" fill="#b45309" rx="8" />
    <text x="15" y="23" class="hdr-text">events</text>
    <text x="250" y="23" class="hdr-tag">Core Entity</text>

    <text x="15" y="55" class="pk-badge">PK</text>
    <text x="40" y="55" class="row-text">event_id</text>
    <text x="210" y="55" class="type-text">INT AUTO_INC</text>

    <text x="15" y="80" class="fk-badge">FK</text>
    <text x="40" y="80" class="row-text">organiser_id</text>
    <text x="210" y="80" class="type-text">INT -> users</text>

    <text x="15" y="105" class="fk-badge">FK</text>
    <text x="40" y="105" class="row-text">venue_id</text>
    <text x="210" y="105" class="type-text">INT -> venues</text>

    <text x="15" y="130" class="fk-badge">FK</text>
    <text x="40" y="130" class="row-text">category_id</text>
    <text x="210" y="130" class="type-text">INT -> categories</text>

    <text x="40" y="155" class="row-text">event_name</text>
    <text x="210" y="155" class="type-text">VARCHAR(150)</text>

    <text x="40" y="180" class="row-text">description</text>
    <text x="210" y="180" class="type-text">TEXT</text>

    <text x="40" y="205" class="row-text">event_date</text>
    <text x="210" y="205" class="type-text">DATE</text>

    <text x="40" y="230" class="row-text">start_time / end_time</text>
    <text x="210" y="230" class="type-text">TIME</text>

    <text x="40" y="255" class="row-text">ticket_price</text>
    <text x="210" y="255" class="type-text">DECIMAL(10,2)</text>

    <text x="40" y="280" class="row-text">total_tickets</text>
    <text x="210" y="280" class="type-text">INT</text>

    <text x="40" y="305" class="row-text">available_tickets</text>
    <text x="210" y="305" class="type-text">INT</text>

    <text x="40" y="330" class="row-text">event_status</text>
    <text x="210" y="330" class="type-text">ENUM(status..)</text>

    <text x="40" y="348" class="row-text">created_at</text>
    <text x="210" y="348" class="type-text">TIMESTAMP</text>
  </g>

  <!-- TABLE: BOOKINGS (Bottom Left) -->
  <g transform="translate(50, 480)">
    <rect width="320" height="240" class="card-bg" />
    <path d="M 0 0 h 320 v 35 h -320 Z" fill="#be123c" rx="8" />
    <text x="15" y="23" class="hdr-text">bookings</text>
    <text x="250" y="23" class="hdr-tag">Core Entity</text>

    <text x="15" y="55" class="pk-badge">PK</text>
    <text x="40" y="55" class="row-text">booking_id</text>
    <text x="210" y="55" class="type-text">INT AUTO_INC</text>

    <text x="15" y="82" class="fk-badge">FK</text>
    <text x="40" y="82" class="row-text">user_id</text>
    <text x="210" y="82" class="type-text">INT -> users</text>

    <text x="15" y="110" class="fk-badge">FK</text>
    <text x="40" y="110" class="row-text">event_id</text>
    <text x="210" y="110" class="type-text">INT -> events</text>

    <text x="40" y="138" class="row-text">quantity</text>
    <text x="210" y="138" class="type-text">INT</text>

    <text x="40" y="165" class="row-text">total_amount</text>
    <text x="210" y="165" class="type-text">DECIMAL(10,2)</text>

    <text x="40" y="190" class="row-text">booking_status</text>
    <text x="210" y="190" class="type-text">ENUM(pending..)</text>

    <text x="40" y="212" class="row-text">booking_date</text>
    <text x="210" y="212" class="type-text">TIMESTAMP</text>

    <text x="40" y="232" class="row-text">ticket_code (UNIQUE)</text>
    <text x="210" y="232" class="type-text">VARCHAR(100)</text>
  </g>

  <!-- TABLE: PAYMENTS (Bottom Right) -->
  <g transform="translate(830, 480)">
    <rect width="320" height="215" class="card-bg" />
    <path d="M 0 0 h 320 v 35 h -320 Z" fill="#0e7490" rx="8" />
    <text x="15" y="23" class="hdr-text">payments</text>
    <text x="250" y="23" class="hdr-tag">Transaction</text>

    <text x="15" y="55" class="pk-badge">PK</text>
    <text x="40" y="55" class="row-text">payment_id</text>
    <text x="210" y="55" class="type-text">INT AUTO_INC</text>

    <text x="15" y="85" class="fk-badge">FK</text>
    <text x="40" y="85" class="row-text">booking_id</text>
    <text x="210" y="85" class="type-text">INT -> bookings</text>

    <text x="40" y="115" class="row-text">payment_method</text>
    <text x="210" y="115" class="type-text">ENUM(banking..)</text>

    <text x="40" y="145" class="row-text">payment_amount</text>
    <text x="210" y="145" class="type-text">DECIMAL(10,2)</text>

    <text x="40" y="170" class="row-text">payment_status</text>
    <text x="210" y="170" class="type-text">ENUM(paid..)</text>

    <text x="40" y="192" class="row-text">transaction_reference</text>
    <text x="210" y="192" class="type-text">VARCHAR(100)</text>

    <text x="40" y="210" class="row-text">payment_date</text>
    <text x="210" y="210" class="type-text">TIMESTAMP</text>
  </g>

  <!-- RELATIONSHIP CONNECTORS -->
  <!-- Users (1) -> (M) Events -->
  <path d="M 370, 180 C 400, 180 400, 470 440, 470" class="line-solid" marker-end="url(#arrow)" />
  <text x="380" y="240" fill="#38bdf8" font-size="11" font-family="sans-serif">1 : M (Organises)</text>

  <!-- Venues (1) -> (M) Events -->
  <path d="M 600, 310 L 600, 390" class="line-solid" marker-end="url(#arrow)" />
  <text x="610" y="350" fill="#38bdf8" font-size="11" font-family="sans-serif">1 : M (Hosts)</text>

  <!-- Categories (1) -> (M) Events -->
  <path d="M 830, 180 C 790, 180 790, 520 760, 520" class="line-solid" marker-end="url(#arrow)" />
  <text x="770" y="300" fill="#38bdf8" font-size="11" font-family="sans-serif">1 : M (Categorises)</text>

  <!-- Users (1) -> (M) Bookings -->
  <path d="M 210, 335 L 210, 480" class="line-solid" marker-end="url(#arrow)" />
  <text x="220" y="410" fill="#38bdf8" font-size="11" font-family="sans-serif">1 : M (Books)</text>

  <!-- Events (1) -> (M) Bookings -->
  <path d="M 440, 600 L 370, 600" class="line-solid" marker-end="url(#arrow)" />
  <text x="385" y="590" fill="#38bdf8" font-size="11" font-family="sans-serif">1 : M</text>

  <!-- Bookings (1) -> (1) Payments -->
  <path d="M 370, 680 C 600, 680 600, 680 830, 680" class="line-solid" marker-end="url(#arrow)" />
  <text x="560" y="670" fill="#38bdf8" font-size="11" font-family="sans-serif">1 : 1 (Paid via)</text>

  <!-- Footer Legend -->
  <g transform="translate(50, 830)">
    <rect width="1100" height="40" fill="#1e293b" rx="6" />
    <text x="20" y="25" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Legend:</text>
    <text x="80" y="25" class="pk-badge">PK</text>
    <text x="105" y="25" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12">Primary Key</text>
    <text x="200" y="25" class="fk-badge">FK</text>
    <text x="225" y="25" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12">Foreign Key</text>
    <line x1="330" y1="21" x2="370" y2="21" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
    <text x="380" y="25" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12">Foreign Key Cardinality Reference (1 to Many)</text>
    <text x="750" y="25" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="12">Database: event_ticketing_db (MySQL 8.0+ / MariaDB)</text>
  </g>
</svg>
